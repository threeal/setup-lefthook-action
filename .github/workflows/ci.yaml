name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Lefthook
        uses: ./

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v2.1.0

      - name: Check pre-commit hook
        run: lefthook run pre-commit --all-files

      - name: Test
        run: pnpm vitest run

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-26
          - windows-2025
          - windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          path: setup-lefthook-action
          sparse-checkout: |
            action.yml
            dist
          sparse-checkout-cone-mode: false

      - name: Setup Lefthook
        id: setup-lefthook
        uses: ./setup-lefthook-action

      - name: Verify latest Lefthook version
        shell: bash
        run: |
          version="$(lefthook version)"
          echo "$version"
          test "$version" != "2.1.0"
          test "$version" = "${{ steps.setup-lefthook.outputs.version }}"

      - name: Setup Lefthook with version input
        id: setup-lefthook-versioned
        uses: ./setup-lefthook-action
        with:
          version: " 2.1.0\n" # surrounding whitespace should be trimmed

      - name: Verify specified Lefthook version
        shell: bash
        run: |
          version="$(lefthook version)"
          echo "$version"
          test "$version" = "2.1.0"
          test "$version" = "${{ steps.setup-lefthook-versioned.outputs.version }}"

      - name: Setup Lefthook from cache
        id: setup-lefthook-cached
        uses: ./setup-lefthook-action
        env:
          PATH: "" # forces cache usage by making curl unavailable

      - name: Verify cached Lefthook version
        shell: bash
        run: |
          version="$(lefthook version)"
          echo "$version"
          test "$version" != "2.1.0"
          test "$version" = "${{ steps.setup-lefthook-cached.outputs.version }}"
