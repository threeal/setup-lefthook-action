name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Lefthook
        uses: ./

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v1.0.0
        with:
          version: 10.33.4

      - name: Check pre-commit hook
        run: lefthook run pre-commit --all-files

      - name: Test
        run: pnpm vitest run

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          path: setup-lefthook-action
          sparse-checkout: |
            action.yml
            dist
          sparse-checkout-cone-mode: false

      - name: Setup Lefthook
        uses: ./setup-lefthook-action

      - name: Verify latest Lefthook version
        shell: bash
        run: |
          version="$(lefthook --version)"
          echo "$version"
          test "$version" != "lefthook version 2.1.0 "

      - name: Setup Lefthook with version input
        uses: ./setup-lefthook-action
        with:
          version: " 2.1.0\n" # surrounding whitespace should be trimmed

      - name: Verify specified Lefthook version
        shell: bash
        run: |
          version="$(lefthook --version)"
          echo "$version"
          test "$version" = "lefthook version 2.1.0 "

      - name: Setup Lefthook from cache
        uses: ./setup-lefthook-action
        env:
          PATH: "" # forces cache usage by making curl unavailable

      - name: Verify cached Lefthook version
        shell: bash
        run: |
          version="$(lefthook --version)"
          echo "$version"
          test "$version" != "lefthook version 2.1.0 "
